[project]
name = "dbb-anschreiber-test-automation"
version = "0.1.0"
description = "Compare DBB quiz questions with a local study catalogue"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"
dependencies = ["pymupdf", "beautifulsoup4", "rapidfuzz", "playwright"]

[project.scripts]
dbb-anschreiber-test-automation = "main:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]
